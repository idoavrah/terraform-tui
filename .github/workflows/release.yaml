name: Release

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

env:
  TFTUI_OFFLINE: "1"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # A tagged release must not ship code that fails its own tests.
      - name: Test
        run: uv run pytest -m "not integration"

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Confirm the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          packaged="$(uv run python -c 'import tftui; print(tftui.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tag" ]; then
            echo "::error::tag $tag does not match packaged version $packaged"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment: test
    permissions:
      id-token: write  # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-production:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-test
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
