name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # Nothing in CI should ever phone home.
  TFTUI_OFFLINE: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  test:
    name: Test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit and end-to-end tests
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  integration:
    name: Integration (${{ matrix.tool.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: terraform
            setup: hashicorp/setup-terraform@v3
          - name: opentofu
            setup: opentofu/setup-opentofu@v1
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Terraform
        if: matrix.tool.name == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.tool.name == 'opentofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.8.5"
          tofu_wrapper: false

      # The suite drives whichever binary is called `terraform`, so alias tofu.
      - name: Alias tofu as terraform
        if: matrix.tool.name == 'opentofu'
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v tofu)" "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Initialise the example project
        working-directory: examples/terraform
        run: terraform init -input=false -no-color

      - name: Integration tests
        run: uv run pytest -m integration -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Verify the wheel installs and runs
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/tftui --version
          /tmp/verify/bin/tftui --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
